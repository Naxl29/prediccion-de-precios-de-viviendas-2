<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predicción de Precio</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

    {% include 'header.html' %}
    
    <form method="POST" class="mt-4">
        <div class="mb-3">
            <label for="area" class="form-label">Área</label>
            <input type="number" class="form-control" name="area" id="area" step="0.01" required>
        </div>

        <div class="mb-3">
            <label for="habitaciones" class="form-label">Habitaciones</label>
            <input type="number" class="form-control" name="habitaciones" id="habitaciones" required>
        </div>

        <button type="submit" class="btn btn-primary">Predecir Precio</button>
    </form>

    {% if prediccion %}
        <div class="alert alert-success mt-4">
            <strong>Precio estimado:</strong> ${{ prediccion | round(2) }}
        </div>
    {% elif error %}
        <div class="alert alert-danger mt-4">
            {{ error }}
        </div>
    {% endif %}
</body>
</html>
